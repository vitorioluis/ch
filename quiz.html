<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo do Campo Harmônico</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #e1e1e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #202024;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-sizing: border-box;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: #a8a8b3;
      margin-bottom: 1.5rem;
    }
    .timer-container {
      width: 100%;
      background-color: #29292e;
      border-radius: 4px;
      height: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background-color: #04d361;
      width: 100%;
      transition: width 0.1s linear, background-color 0.3s;
    }
    .lives {
      font-size: 1.2rem;
      letter-spacing: 2px;
    }
    .question {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      color: #c4c4cc;
      line-height: 1.6;
    }
    .grau-highlight {
      display: inline-block;
      background-color: #04d361;
      color: #121214;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 4px;
      box-shadow: 0 2px 8px rgba(4, 211, 97, 0.3);
      vertical-align: middle;
    }
    .key-badge {
      font-size: 1.8rem;
      font-weight: bold;
      color: #04d361;
      margin-bottom: 1.5rem;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    button, input[type="number"] {
      background: #29292e;
      border: 1px solid #323238;
      color: #fff;
      padding: 12px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    input[type="number"] {
      cursor: text;
    }
    input[type="number"]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #323238;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-action {
      background: #8257e5;
      margin-top: 1rem;
      font-weight: bold;
    }
    .btn-action:hover {
      background: #996dff;
    }
    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
      background: #29292e;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #323238;
    }
    .form-group-title {
      font-size: 0.95rem;
      color: #a8a8b3;
      margin-bottom: 0.6rem;
      font-weight: bold;
    }
    .feedback {
      min-height: 24px;
      font-weight: bold;
    }
    .correct { color: #04d361; }
    .wrong { color: #f75a68; }
    .title {
      color: #04d361;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    .checkbox-group:last-child {
      margin-bottom: 0;
    }
    .checkbox-group input {
      width: auto;
      cursor: pointer;
      accent-color: #04d361;
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <!-- Conteúdo renderizado via JS -->
</div>

<script>
  const synth = new Tone.PolySynth(Tone.Synth).toDestination();

  const database = [
    {
      tom: 'C (Dó Maior)',
      tipo: 'maior',
      graus: [
        { grau: 'I', acorde: 'C', notas: ['C4', 'E4', 'G4'], isSeventh: false },
        { grau: 'ii', acorde: 'Dm', notas: ['D4', 'F4', 'A4'], isSeventh: false },
        { grau: 'iii', acorde: 'Em', notas: ['E4', 'G4', 'B4'], isSeventh: false },
        { grau: 'IV', acorde: 'F', notas: ['F4', 'A4', 'C5'], isSeventh: false },
        { grau: 'V', acorde: 'G', notas: ['G4', 'B4', 'D5'], isSeventh: false },
        { grau: 'vi', acorde: 'Am', notas: ['A4', 'C5', 'E5'], isSeventh: false },
        { grau: 'vii°', acorde: 'Bdim', notas: ['B4', 'D5', 'F5'], isSeventh: true }
      ]
    },
    {
      tom: 'G (Sol Maior)',
      tipo: 'maior',
      graus: [
        { grau: 'I', acorde: 'G', notas: ['G4', 'B4', 'D5'], isSeventh: false },
        { grau: 'ii', acorde: 'Am', notas: ['A4', 'C5', 'E5'], isSeventh: false },
        { grau: 'iii', acorde: 'Bm', notas: ['B4', 'D5', 'F#5'], isSeventh: false },
        { grau: 'IV', acorde: 'C', notas: ['C4', 'E4', 'G4'], isSeventh: false },
        { grau: 'V', acorde: 'D', notas: ['D4', 'F#4', 'A4'], isSeventh: false },
        { grau: 'vi', acorde: 'Em', notas: ['E4', 'G4', 'B4'], isSeventh: false },
        { grau: 'vii°', acorde: 'F#dim', notas: ['F#4', 'A4', 'C5'], isSeventh: true }
      ]
    },
    {
      tom: 'Am (Lá Menor)',
      tipo: 'menor',
      graus: [
        { grau: 'i', acorde: 'Am', notas: ['A4', 'C5', 'E5'], isSeventh: false },
        { grau: 'ii°', acorde: 'Bdim', notas: ['B4', 'D5', 'F5'], isSeventh: false },
        { grau: 'III', acorde: 'C', notas: ['C4', 'E4', 'G4'], isSeventh: false },
        { grau: 'iv', acorde: 'Dm', notas: ['D4', 'F4', 'A4'], isSeventh: false },
        { grau: 'v', acorde: 'Em', notas: ['E4', 'G4', 'B4'], isSeventh: false },
        { grau: 'VI', acorde: 'F', notas: ['F4', 'A4', 'C5'], isSeventh: false },
        { grau: 'VII', acorde: 'G', notas: ['G4', 'B4', 'D5'], isSeventh: true }
      ]
    },
    {
      tom: 'Em (Mi Menor)',
      tipo: 'menor',
      graus: [
        { grau: 'i', acorde: 'Em', notas: ['E4', 'G4', 'B4'], isSeventh: false },
        { grau: 'ii°', acorde: 'F#dim', notas: ['F#4', 'A4', 'C5'], isSeventh: false },
        { grau: 'III', acorde: 'G', notas: ['G4', 'B4', 'D5'], isSeventh: false },
        { grau: 'iv', acorde: 'Am', notas: ['A4', 'C5', 'E5'], isSeventh: false },
        { grau: 'v', acorde: 'Bm', notas: ['B4', 'D5', 'F#5'], isSeventh: false },
        { grau: 'VI', acorde: 'C', notas: ['C4', 'E4', 'G4'], isSeventh: false },
        { grau: 'VII', acorde: 'D', notas: ['D4', 'F#4', 'A4'], isSeventh: true }
      ]
    }
  ];

  let config = {
    incluirMaiores: true,
    incluirMenores: true,
    incluirSetimo: true,
    usarTempo: true,
    tempoLimite: 10
  };

  let currentScore = 0;
  let lives = 3;
  let currentTarget = null;
  let isAnswered = false;
  let timerInterval = null;

  function getRandomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function playChord(notes) {
    Tone.start();
    synth.triggerAttackRelease(notes, '1n');
  }

  function toggleTempoInput() {
    const semTempoCheck = document.getElementById('check-sem-tempo').checked;
    const inputTempo = document.getElementById('input-tempo');
    inputTempo.disabled = semTempoCheck;
  }

  function renderStartScreen() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="title">Campo Harmônico</div>
      
      <div class="form-group">
        <div class="form-group-title">Modos do Campo Harmônico:</div>
        <label class="checkbox-group">
          <input type="checkbox" id="check-maiores" checked>
          Campos Maiores
        </label>
        <label class="checkbox-group">
          <input type="checkbox" id="check-menores" checked>
          Campos Menores
        </label>
      </div>

      <div class="form-group">
        <div class="form-group-title">Opções de Graus:</div>
        <label class="checkbox-group">
          <input type="checkbox" id="check-setimo" checked>
          Incluir 7º Grau (vii° / VII)
        </label>
      </div>

      <div class="form-group">
        <div class="form-group-title">Configuração de Tempo:</div>
        <label class="checkbox-group" style="margin-bottom: 0.8rem;">
          <input type="checkbox" id="check-sem-tempo" onchange="toggleTempoInput()">
          Sem tempo limite
        </label>
        <input type="number" id="input-tempo" value="10" min="3" max="60" placeholder="Segundos por pergunta">
      </div>

      <div id="error-msg" class="wrong" style="min-height: 20px; font-size: 0.85rem; margin-top: 5px;"></div>

      <button class="btn-action" onclick="startGame()">Iniciar Jogo</button>
    `;
  }

  function startGame() {
    const checkMaiores = document.getElementById('check-maiores').checked;
    const checkMenores = document.getElementById('check-menores').checked;
    const checkSetimo = document.getElementById('check-setimo').checked;
    const semTempo = document.getElementById('check-sem-tempo').checked;
    const tempoInput = parseInt(document.getElementById('input-tempo').value, 10);

    if (!checkMaiores && !checkMenores) {
      document.getElementById('error-msg').textContent = 'Selecione pelo menos um modo!';
      return;
    }

    if (!semTempo && (isNaN(tempoInput) || tempoInput < 3)) {
      document.getElementById('error-msg').textContent = 'O tempo mínimo é de 3 segundos!';
      return;
    }

    config.incluirMaiores = checkMaiores;
    config.incluirMenores = checkMenores;
    config.incluirSetimo = checkSetimo;
    config.usarTempo = !semTempo;
    config.tempoLimite = tempoInput;

    currentScore = 0;
    lives = 3;

    renderGameLayout();
    nextQuestion();
  }

  function renderGameLayout() {
    const app = document.getElementById('app');
    
    // Se não usa tempo, não renderiza a div do timer
    const timerHtml = config.usarTempo 
      ? `<div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>`
      : ``;

    app.innerHTML = `
      <div class="status-bar">
        <div>Pontuação: <span id="score">0</span></div>
        <div class="lives" id="lives">❤️❤️❤️</div>
      </div>
      ${timerHtml}
      <div id="game-content"></div>
    `;
  }

  function updateLivesDisplay() {
    const hearts = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
    document.getElementById('lives').textContent = hearts;
  }

  function startTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    // Se a opção sem tempo estiver marcada, encerra aqui sem executar a animação
    if (!config.usarTempo) return;

    const timerBar = document.getElementById('timer-bar');
    if (!timerBar) return;
    
    timerBar.style.width = '100%';
    timerBar.style.backgroundColor = '#04d361';

    const intervalTime = 100;
    const totalSteps = (config.tempoLimite * 1000) / intervalTime;
    let currentStep = totalSteps;

    timerInterval = setInterval(() => {
      currentStep--;
      const percentage = (currentStep / totalSteps) * 100;
      
      if (timerBar) {
        timerBar.style.width = `${percentage}%`;
        if (percentage < 30) {
          timerBar.style.backgroundColor = '#f75a68';
        }
      }

      if (currentStep <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        handleTimeout();
      }
    }, intervalTime);
  }

  function handleTimeout() {
    if (isAnswered) return;
    isAnswered = true;

    const feedback = document.getElementById('feedback');
    const buttons = document.querySelectorAll('#options-container button');
    buttons.forEach(btn => btn.disabled = true);

    lives--;
    updateLivesDisplay();

    feedback.textContent = `Tempo Esgotado! O correto era ${currentTarget.acorde}`;
    feedback.className = 'feedback wrong';

    if (lives <= 0) {
      setTimeout(gameOver, 1500);
    } else {
      setTimeout(nextQuestion, 1500);
    }
  }

  function nextQuestion() {
    isAnswered = false;
    
    let poolTons = database.filter(d => {
      if (d.tipo === 'maior' && config.incluirMaiores) return true;
      if (d.tipo === 'menor' && config.incluirMenores) return true;
      return false;
    });

    const tomData = getRandomItem(poolTons);

    let poolGraus = tomData.graus;
    if (!config.incluirSetimo) {
      poolGraus = poolGraus.filter(g => !g.isSeventh);
    }

    const itemData = getRandomItem(poolGraus);
    currentTarget = { ...itemData, tomName: tomData.tom };

    const gameContent = document.getElementById('game-content');
    gameContent.innerHTML = `
      <div class="question">Qual é o acorde do grau <span class="grau-highlight">${itemData.grau}</span> em:</div>
      <div class="key-badge" id="tom-target">${tomData.tom}</div>
      <div class="options" id="options-container"></div>
      <div class="feedback" id="feedback"></div>
    `;

    const optionsContainer = document.getElementById('options-container');
    
    let validChordsPool = database.flatMap(d => d.graus)
      .filter(g => config.incluirSetimo || !g.isSeventh)
      .map(g => g.acorde);
      
    validChordsPool = [...new Set(validChordsPool)];

    let options = [itemData.acorde];

    while (options.length < 4) {
      const randomChord = getRandomItem(validChordsPool);
      if (!options.includes(randomChord)) {
        options.push(randomChord);
      }
    }

    options.sort(() => Math.random() - 0.5);

    options.forEach(chord => {
      const btn = document.createElement('button');
      btn.textContent = chord;
      btn.onclick = () => checkAnswer(chord);
      optionsContainer.appendChild(btn);
    });

    // Chama o timer apenas se estiver ativado nas configurações
    if (config.usarTempo) {
      startTimer();
    }
  }

  function checkAnswer(selectedChord) {
    if (isAnswered) return;
    isAnswered = true;
    
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    const feedback = document.getElementById('feedback');
    const buttons = document.querySelectorAll('#options-container button');
    buttons.forEach(btn => btn.disabled = true);

    playChord(currentTarget.notas);

    if (selectedChord === currentTarget.acorde) {
      currentScore += 10;
      feedback.textContent = 'Correto!';
      feedback.className = 'feedback correct';
      document.getElementById('score').textContent = currentScore;
      setTimeout(nextQuestion, 1500);
    } else {
      lives--;
      updateLivesDisplay();
      feedback.textContent = `Incorreto! O certo era ${currentTarget.acorde}`;
      feedback.className = 'feedback wrong';

      if (lives <= 0) {
        setTimeout(gameOver, 1500);
      } else {
        setTimeout(nextQuestion, 1500);
      }
    }
  }

  function gameOver() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    const gameContent = document.getElementById('game-content');
    gameContent.innerHTML = `
      <div class="wrong" style="font-size: 2rem; margin-bottom: 0.5rem;">Game Over!</div>
      <p>Você perdeu todas as vidas.</p>
      <p style="font-size: 1.2rem; margin: 1rem 0;">Pontuação Final: <b>${currentScore}</b></p>
      <button class="btn-action" onclick="renderStartScreen()">Voltar ao Menu</button>
    `;
  }

  renderStartScreen();
</script>

</body>
</html>
